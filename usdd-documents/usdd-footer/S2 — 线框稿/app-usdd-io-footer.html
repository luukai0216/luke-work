<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Footer 改版 — app.usdd.io Prototype</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font:400 14px/1.5 Inter,-apple-system,sans-serif;background:var(--bg-page);color:var(--text-primary)}
    :root{
      --bg-page:#0F0F0F;--bg-section:#161616;--bg-card:#1A1A1A;
      --text-primary:#EBEBEB;--text-secondary:#999999;--text-tertiary:#555555;--text-disabled:#3A3A3A;
      --border-default:#2A2A2A;--border-weak:#222222;
      --accent:#4ECFA8;
      --r-xs:4px;--r-md:8px;--r-lg:16px;
    }
    .container{width:1440px;max-width:100%;margin:0 auto;padding:0 48px}
    @media(max-width:1471px){.container{width:1200px}}
    @media(max-width:1199px){.container{width:auto;padding:0 24px}}

    .main{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-disabled);font-size:12px;letter-spacing:.08em}

    /* ── Footer ── */
    .app-footer{
      background:var(--bg-card);
      border-top:1px solid var(--border-default);
      min-height:80px;
    }
    .app-footer-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:36px;
      min-height:80px;
    }
    .footer-copyright{
      font-size:12px;
      color:var(--text-tertiary);
      white-space:nowrap;
      flex-shrink:0;
      margin-right:auto;
    }
    .footer-nav{display:flex;align-items:center;justify-content:center;gap:2px;flex:0 0 auto}
    .footer-nav-link{
      display:inline-flex;
      align-items:center;
      height:30px;
      padding:0 8px;
      font-size:12.5px;
      color:var(--text-secondary);
      text-decoration:none;
      border-radius:var(--r-md);
      white-space:nowrap;
      transition:background .15s,color .15s;
    }
    .footer-nav-link:hover{background:var(--bg-section);color:var(--text-primary)}
    .footer-socials{display:flex;align-items:center;justify-content:flex-end;gap:4px;flex-shrink:0}
    .footer-social-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:34px;
      height:34px;
      border-radius:50%;
      border:1px solid var(--border-default);
      color:var(--text-secondary);
      font-size:16px;
      text-decoration:none;
      transition:border-color .15s,color .15s,background .15s;
    }
    .footer-social-btn:hover{border-color:#444;color:var(--text-primary);background:var(--bg-section)}
    .app-footer-divider{
      display:block;
      width:1px;
      height:24px;
      margin:0 40px;
      background:var(--border-default);
      flex-shrink:0;
    }

    /* 响应式 */
    @media(max-width:1050px){
      .container{padding:0 32px}
      .app-footer{
        min-height:393px;
        display:flex;
        align-items:stretch;
      }
      .app-footer .container{width:100%}
      .app-footer-inner{
        flex-direction:column;
        align-items:stretch;
        justify-content:flex-start;
        gap:0;
        min-height:393px;
        padding:48px 0 0;
      }
      .footer-nav{
        display:grid;
        grid-template-columns:max-content max-content;
        grid-template-rows:repeat(3,auto);
        grid-auto-flow:column;
        align-items:start;
        justify-content:center;
        column-gap:58px;
        row-gap:14px;
        flex:0 0 auto;
        order:1;
      }
      .footer-nav-link{
        justify-content:flex-start;
      }
      .app-footer-divider{
        display:block;
        width:100%;
        height:1px;
        margin:46px 0 52px;
        background:var(--border-default);
        order:2;
      }
      .footer-socials{
        justify-content:center;
        gap:4px;
        order:3;
      }
      .footer-social-btn{
        width:34px;
        height:34px;
      }
      .footer-copyright{
        margin-top:56px;
        margin-right:0;
        text-align:center;
        white-space:normal;
        order:4;
      }
    }
  </style>
</head>
<body>

<main class="main">APP CONTENT AREA</main>

<footer class="app-footer">
  <div class="container">
    <div class="app-footer-inner">
      <div class="footer-copyright">Copyright © 2026 USDD. All rights reserved</div>
      <nav class="footer-nav">
        <a href="https://docs.usdd.io/lrgals/terms-of-use" target="_blank" class="footer-nav-link">Terms of Use</a>
        <a href="https://docs.usdd.io/lrgals/privacy-policy" target="_blank" class="footer-nav-link">Privacy Policy</a>
        <a href="https://docs.usdd.io/" target="_blank" class="footer-nav-link">Docs</a>
        <a href="#" class="footer-nav-link">MCP Server</a>
        <a href="https://usdd.io/faq" target="_blank" class="footer-nav-link">FAQs</a>
        <a href="mailto:contact@usdd.io" class="footer-nav-link">Support</a>
      </nav>
      <div class="app-footer-divider"></div>
      <div class="footer-socials">
        <a href="https://x.com/usdd_io" target="_blank" class="footer-social-btn" title="X / Twitter" aria-label="X / Twitter">
          <i class="ri-twitter-x-line"></i>
        </a>
        <a href="https://t.me/usdd_official" target="_blank" class="footer-social-btn" title="Telegram" aria-label="Telegram">
          <i class="ri-telegram-line"></i>
        </a>
        <a href="https://discord.gg/usdd" target="_blank" class="footer-social-btn" title="Discord" aria-label="Discord">
          <i class="ri-discord-line"></i>
        </a>
      </div>
    </div>
  </div>
</footer>

</body>
</html>
