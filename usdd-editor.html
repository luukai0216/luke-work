<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USDD 3D 编辑器</title>
    <style>
      :root {
        --brand: #00c566;
        --brand-dim: #00a857;
        --bg: #14161a;
        --panel: #1b1e24;
        --panel-2: #23272f;
        --line: #2c313a;
        --text: #e8eaed;
        --text-dim: #9aa3ad;
        --input-bg: #0f1115;
        --danger: #ff5a5a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: var(--bg);
        font-size: 13px;
      }
      .app { display: flex; height: 100vh; width: 100%; }

      /* viewport */
      .viewport { position: relative; flex: 1 1 auto; min-width: 0; }
      #canvas { display: block; width: 100%; height: 100%; }

      .topbar {
        position: absolute; top: 0; left: 0; right: 0; height: 48px;
        display: flex; align-items: center; gap: 12px; padding: 0 16px;
        background: linear-gradient(180deg, rgba(20,22,26,.9), rgba(20,22,26,0));
        pointer-events: none; z-index: 10;
      }
      .topbar .brand { font-weight: 700; letter-spacing: .3px; pointer-events: auto; }
      .topbar .brand span { color: var(--brand); }
      .topbar .spacer { flex: 1; }
      .topbar .btn { pointer-events: auto; }

      .btn {
        appearance: none; border: 1px solid var(--line); background: var(--panel-2);
        color: var(--text); padding: 7px 12px; border-radius: 8px; cursor: pointer;
        font-size: 12px; font-weight: 600; transition: .15s; white-space: nowrap;
      }
      .btn:hover { border-color: var(--brand); color: var(--brand); }
      .btn.primary { background: var(--brand); border-color: var(--brand); color: #03130b; }
      .btn.primary:hover { background: var(--brand-dim); color: #03130b; }
      .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
      .btn.sm { padding: 4px 8px; font-size: 11px; }

      .hint {
        position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,.55); color: var(--text-dim); padding: 6px 14px;
        border-radius: 20px; font-size: 11px; z-index: 10; backdrop-filter: blur(6px);
      }
      .loading {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px; background: var(--bg); z-index: 20;
      }
      .spinner {
        width: 42px; height: 42px; border: 3px solid var(--line);
        border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loading .bar { width: 220px; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
      .loading .bar > i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .2s; }

      /* right panel */
      .panel {
        width: 320px; flex: 0 0 320px; background: var(--panel);
        border-left: 1px solid var(--line); display: flex; flex-direction: column;
      }
      .panel-tabs { display: flex; border-bottom: 1px solid var(--line); }
      .panel-tabs button {
        flex: 1; appearance: none; background: transparent; border: none; color: var(--text-dim);
        padding: 12px 4px; cursor: pointer; font-size: 12px; font-weight: 600; border-bottom: 2px solid transparent;
      }
      .panel-tabs button.active { color: var(--brand); border-bottom-color: var(--brand); }
      .panel-body { flex: 1; overflow-y: auto; padding: 14px; }
      .tab-page { display: none; }
      .tab-page.active { display: block; }

      .section { margin-bottom: 18px; }
      .section h3 {
        margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
        color: var(--text-dim); font-weight: 700;
      }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
      .row label { flex: 0 0 76px; color: var(--text-dim); font-size: 12px; }
      .row .val { flex: 1; }
      input[type="range"] { width: 100%; accent-color: var(--brand); }
      input[type="number"], input[type="text"], select {
        width: 100%; background: var(--input-bg); border: 1px solid var(--line);
        border-radius: 6px; color: var(--text); padding: 6px 8px; font-size: 12px;
      }
      input[type="color"] {
        width: 38px; height: 28px; padding: 0; border: 1px solid var(--line);
        border-radius: 6px; background: var(--input-bg); cursor: pointer;
      }
      .xyz { display: flex; gap: 6px; }
      .xyz > div { flex: 1; display: flex; flex-direction: column; gap: 3px; }
      .xyz small { color: var(--text-dim); font-size: 10px; text-align: center; }
      .checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .checkbox input { accent-color: var(--brand); width: 15px; height: 15px; }

      /* tree */
      .tree { font-size: 12px; }
      .tree-item {
        display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 6px;
        cursor: pointer; white-space: nowrap; user-select: none;
      }
      .tree-item:hover { background: var(--panel-2); }
      .tree-item.selected { background: rgba(0,197,102,.16); color: var(--brand); }
      .tree-item .twisty { width: 14px; text-align: center; color: var(--text-dim); flex: 0 0 14px; }
      .tree-item .ic { opacity: .7; }
      .tree-item .nm { overflow: hidden; text-overflow: ellipsis; }
      .tree-children { padding-left: 14px; }
      .tree-item .vis { margin-left: auto; opacity: .5; font-size: 11px; }
      .tree-item .vis:hover { opacity: 1; }

      .empty { color: var(--text-dim); font-size: 12px; padding: 8px 0; }
      .val-num { display: flex; align-items: center; gap: 6px; }
      .val-num input[type="range"] { flex: 1; }
      .val-num input[type="number"] { flex: 0 0 56px; }
      .muted { color: var(--text-dim); font-size: 11px; }
      .pill { display:inline-block; padding:2px 7px; border:1px solid var(--line); border-radius: 20px; font-size: 11px; color: var(--text-dim); }
      .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
      hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="viewport">
        <canvas id="canvas"></canvas>
        <div class="topbar">
          <div class="brand">USD<span>D</span> 3D 编辑器</div>
          <div class="spacer"></div>
          <button class="btn" id="btnOpen">打开 GLB</button>
          <input type="file" id="fileInput" accept=".glb,.gltf" style="display:none" />
          <button class="btn primary" id="btnExport">导出 GLB</button>
        </div>
        <div class="hint">左键旋转 · 右键平移 · 滚轮缩放 · 点击物体选中</div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <div class="muted" id="loadingText">正在加载 usdd.glb…</div>
          <div class="bar"><i id="loadingBar"></i></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-tabs">
          <button data-tab="scene" class="active">场景</button>
          <button data-tab="object">物体</button>
          <button data-tab="render">渲染</button>
        </div>
        <div class="panel-body">
          <!-- SCENE TAB -->
          <div class="tab-page active" id="tab-scene">
            <div class="section">
              <h3>场景层级</h3>
              <div class="tree" id="tree"><div class="empty">尚未加载模型</div></div>
            </div>
          </div>

          <!-- OBJECT TAB -->
          <div class="tab-page" id="tab-object">
            <div id="noSelection" class="empty">在场景或视图中选择一个物体</div>
            <div id="objectProps" style="display:none">
              <div class="section">
                <h3>物体</h3>
                <div class="row"><label>名称</label><div class="val"><input type="text" id="objName" /></div></div>
                <div class="row"><label>类型</label><div class="val"><span class="pill" id="objType">—</span></div></div>
                <label class="checkbox" style="margin-top:6px"><input type="checkbox" id="objVisible" />可见</label>
              </div>
              <div class="section">
                <h3>变换</h3>
                <div class="row" style="align-items:flex-end">
                  <label>位置</label>
                  <div class="xyz">
                    <div><small>X</small><input type="number" step="0.01" id="posX" /></div>
                    <div><small>Y</small><input type="number" step="0.01" id="posY" /></div>
                    <div><small>Z</small><input type="number" step="0.01" id="posZ" /></div>
                  </div>
                </div>
                <div class="row" style="align-items:flex-end">
                  <label>旋转°</label>
                  <div class="xyz">
                    <div><small>X</small><input type="number" step="1" id="rotX" /></div>
                    <div><small>Y</small><input type="number" step="1" id="rotY" /></div>
                    <div><small>Z</small><input type="number" step="1" id="rotZ" /></div>
                  </div>
                </div>
                <div class="row" style="align-items:flex-end">
                  <label>缩放</label>
                  <div class="xyz">
                    <div><small>X</small><input type="number" step="0.01" id="sclX" /></div>
                    <div><small>Y</small><input type="number" step="0.01" id="sclY" /></div>
                    <div><small>Z</small><input type="number" step="0.01" id="sclZ" /></div>
                  </div>
                </div>
                <div class="btn-group" style="margin-top:4px">
                  <button class="btn sm" id="btnResetTransform">重置变换</button>
                  <button class="btn sm" id="btnFocus">聚焦</button>
                </div>
              </div>
              <div class="section" id="materialSection" style="display:none">
                <h3>材质</h3>
                <div class="row"><label>颜色</label><div class="val val-num"><input type="color" id="matColor" /><span class="muted" id="matColorHex"></span></div></div>
                <div class="row"><label>自发光</label><div class="val val-num"><input type="color" id="matEmissive" /><span class="muted">强度</span><input type="number" id="matEmissiveInt" step="0.1" min="0" style="flex:0 0 56px"/></div></div>
                <div class="row"><label>金属度</label><div class="val val-num"><input type="range" id="matMetalness" min="0" max="1" step="0.01" /><input type="number" id="matMetalnessN" min="0" max="1" step="0.01" /></div></div>
                <div class="row"><label>粗糙度</label><div class="val val-num"><input type="range" id="matRoughness" min="0" max="1" step="0.01" /><input type="number" id="matRoughnessN" min="0" max="1" step="0.01" /></div></div>
                <div class="row"><label>不透明度</label><div class="val val-num"><input type="range" id="matOpacity" min="0" max="1" step="0.01" /><input type="number" id="matOpacityN" min="0" max="1" step="0.01" /></div></div>
                <label class="checkbox" style="margin-bottom:8px"><input type="checkbox" id="matWireframe" />线框模式</label>
                <label class="checkbox"><input type="checkbox" id="matFlat" />平面着色</label>
              </div>
            </div>
          </div>

          <!-- RENDER TAB -->
          <div class="tab-page" id="tab-render">
            <div class="section">
              <h3>环境</h3>
              <div class="row"><label>背景</label><div class="val val-num"><input type="color" id="bgColor" value="#14161a" /><span class="muted" id="bgColorHex">#14161a</span></div></div>
              <label class="checkbox" style="margin-bottom:8px"><input type="checkbox" id="bgTransparent" />透明背景</label>
              <div class="row"><label>环境贴图</label><div class="val"><select id="envPreset">
                <option value="none">无</option>
                <option value="studio" selected>影棚</option>
                <option value="sky">天空</option>
                <option value="warehouse">仓库</option>
              </select></div></div>
              <label class="checkbox"><input type="checkbox" id="showGrid" checked />显示网格</label>
            </div>
            <div class="section">
              <h3>环境光</h3>
              <div class="row"><label>颜色</label><div class="val"><input type="color" id="ambColor" value="#ffffff" /></div></div>
              <div class="row"><label>强度</label><div class="val val-num"><input type="range" id="ambInt" min="0" max="3" step="0.05" value="0.6" /><input type="number" id="ambIntN" min="0" max="3" step="0.05" value="0.6" /></div></div>
            </div>
            <div class="section">
              <h3>主光源 (平行光)</h3>
              <div class="row"><label>颜色</label><div class="val"><input type="color" id="dirColor" value="#ffffff" /></div></div>
              <div class="row"><label>强度</label><div class="val val-num"><input type="range" id="dirInt" min="0" max="5" step="0.05" value="2.5" /><input type="number" id="dirIntN" min="0" max="5" step="0.05" value="2.5" /></div></div>
              <label class="checkbox"><input type="checkbox" id="dirShadow" checked />投射阴影</label>
            </div>
            <div class="section">
              <h3>相机</h3>
              <div class="row"><label>视野 FOV</label><div class="val val-num"><input type="range" id="camFov" min="20" max="100" step="1" value="50" /><input type="number" id="camFovN" min="20" max="100" step="1" value="50" /></div></div>
              <div class="btn-group">
                <button class="btn sm" data-view="front">前</button>
                <button class="btn sm" data-view="back">后</button>
                <button class="btn sm" data-view="left">左</button>
                <button class="btn sm" data-view="right">右</button>
                <button class="btn sm" data-view="top">顶</button>
                <button class="btn sm" data-view="iso">等轴</button>
              </div>
            </div>
            <hr />
            <div class="btn-group">
              <button class="btn" id="btnFit">适配视图</button>
              <button class="btn danger" id="btnReset">重置全部</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./usdd-editor.js"></script>
  </body>
</html>
