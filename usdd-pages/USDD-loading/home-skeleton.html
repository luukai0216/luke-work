<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USDD — Skeleton Loading · home.usdd.io</title>
  <style>

    /* ─── Reset ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0f;
      color: #e8e8e8;
      line-height: 1.5;
    }

    /* ─── Container ─── */
    .container { width: 100%; margin: 0 auto; }
    @media (min-width: 1472px) { .container { width: 1440px; padding: 0 24px; } }11
    @media (min-width: 1200px) and (max-width: 1471px) { .container { width: 1200px; padding: 0 24px; } }
    @media (min-width: 767px) and (max-width: 1199px) { .container { padding: 0 20px; } }
    @media (max-width: 766px) { .container { padding: 0 20px; } }

    /* ─── Shimmer Keyframe ─── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }

    /* Skeleton base atom — every placeholder uses this */
    .sk {
      background: rgba(255,255,255,0.06);
      background-image: linear-gradient(
        90deg,
        rgba(255,255,255,0.00) 0%,
        rgba(255,255,255,0.07) 40%,
        rgba(255,255,255,0.12) 50%,
        rgba(255,255,255,0.07) 60%,
        rgba(255,255,255,0.00) 100%
      );
      background-size: 600px 100%;
      background-repeat: no-repeat;
      animation: shimmer 1.6s infinite linear;
      border-radius: 6px;
    }

    /* ─── Stagger delays so shimmer feels organic ─── */
    .sk:nth-child(1)  { animation-delay: 0.00s; }
    .sk:nth-child(2)  { animation-delay: 0.08s; }
    .sk:nth-child(3)  { animation-delay: 0.16s; }
    .sk:nth-child(4)  { animation-delay: 0.24s; }
    .sk:nth-child(5)  { animation-delay: 0.32s; }
    .sk:nth-child(6)  { animation-delay: 0.40s; }

    /* ─── Text bar shortcuts ─── */
    .sk-h1  { height: 40px; }
    .sk-h2  { height: 28px; }
    .sk-h3  { height: 20px; }
    .sk-body{ height: 14px; }
    .sk-sm  { height: 12px; }
    .sk-btn { height: 44px; border-radius: 10px; }
    .sk-btn-sm { height: 34px; border-radius: 8px; }
    .sk-circle { border-radius: 50%; }

    /* Spacer between skeleton rows */
    .sk-gap { margin-top: 10px; }
    .sk-gap-lg { margin-top: 20px; }

    /* ─── Demo toggle bar (not part of skeleton; just for preview) ─── */
    .demo-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(124,58,237,0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 100px;
      padding: 10px 24px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      z-index: 999;
      white-space: nowrap;
    }

    /* ─── HEADER ─── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,15,0.90);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      gap: 32px;
    }

    /* Logo area */
    .nav-logo-sk { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .nav-logo-icon-sk { width: 36px; height: 36px; flex-shrink: 0; }
    .nav-logo-text-sk { display: flex; flex-direction: column; gap: 6px; }

    /* Nav links */
    .nav-links-sk { display: flex; gap: 8px; flex: 1; }
    @media (max-width: 766px) { .nav-links-sk { display: none; } }

    /* ─── HERO ─── */
    .hero { padding: 100px 0 80px; }
    .hero-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    @media (max-width: 1199px) {
      .hero-inner { grid-template-columns: 1fr; }
      .hero-visual-sk { display: none; }
    }
    @media (max-width: 766px) {
      .hero { padding: 60px 0 48px; }
    }

    .hero-title-sk { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .hero-actions-sk { display: flex; gap: 12px; margin-bottom: 40px; }
    .hero-stats-sk { display: flex; gap: 16px; flex-wrap: wrap; }
    .hero-stat-card-sk {
      flex: 1;
      min-width: 160px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Hero carousel visual */
    .hero-visual-sk {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 28px;
      gap: 12px;
      overflow: hidden;
      position: relative;
    }
    /* Shimmer inside carousel */
    .hero-visual-inner-sk {
      position: absolute;
      inset: 0;
    }
    .hero-visual-dots-sk { display: flex; gap: 8px; position: relative; z-index: 1; }
    .hero-visual-dots-sk span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
    }
    .hero-visual-dots-sk span.active { background: rgba(124,58,237,0.6); }

    /* ─── EARN SECTION ─── */
    .earn-section { margin-bottom: 80px; }
    .earn-header-sk {
      text-align: center;
      margin-bottom: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .earn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 1199px) { .earn-grid { grid-template-columns: 1fr; } }

    .earn-card-sk {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 28px;
    }
    .earn-card-header-sk {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 10px;
    }
    .chain-tabs-sk { display: flex; gap: 4px; }

    /* Number data: APY row */
    .apy-row-sk { display: flex; gap: 24px; margin-bottom: 16px; }
    .apy-item-sk { display: flex; flex-direction: column; gap: 6px; }

    /* Chart area skeleton — stacked bars */
    .chart-sk {
      width: 100%;
      height: 160px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      padding: 16px 12px 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 0;
      position: relative;
      overflow: hidden;
      margin-top: 8px;
    }
    /* Chart shimmer bars: variable widths simulate a line chart ghost */
    .chart-bars-sk {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 100%;
      padding-bottom: 8px;
    }
    .chart-bar-sk {
      flex: 1;
      border-radius: 3px 3px 0 0;
      background: rgba(255,255,255,0.06);
      background-image: linear-gradient(
        90deg,
        rgba(255,255,255,0.00) 0%,
        rgba(255,255,255,0.07) 50%,
        rgba(255,255,255,0.00) 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite linear;
    }
    .chart-axis-sk {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
    }

    /* Yield simulator form */
    .sim-form-sk {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 766px) { .sim-form-sk { grid-template-columns: 1fr; } }
    .sim-field-sk { display: flex; flex-direction: column; gap: 6px; }
    .sim-field-input-sk {
      height: 42px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
    }
    .sim-actions-sk { display: flex; gap: 10px; margin-bottom: 20px; }
    .sim-result-sk {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      margin-bottom: 12px;
    }
    @media (max-width: 766px) { .sim-result-sk { grid-template-columns: 1fr; } }
    .sim-result-item-sk { display: flex; flex-direction: column; gap: 6px; }

    /* ─── WHY USDD ─── */
    .why-section { margin-bottom: 80px; }
    .why-features-sk {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 766px) { .why-features-sk { grid-template-columns: 1fr; } }
    .why-feature-card-sk {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-grid-4-sk {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 1199px) { .card-grid-4-sk { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 766px) { .card-grid-4-sk { grid-template-columns: 1fr; } }
    .feature-card-sk {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ─── TRANSITION SECTION ─── */
    .transition-section { margin-bottom: 80px; }
    .transition-grid-sk {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 24px;
    }
    @media (max-width: 1199px) { .transition-grid-sk { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 766px) { .transition-grid-sk { grid-template-columns: 1fr; } }
    .transition-card-sk {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tc-icon-sk {
      width: 48px;
      height: 48px;
      border-radius: 12px;
    }

    /* ─── TOKENS & NEWS ─── */
    .bottom-grid-sk {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 80px;
    }
    @media (max-width: 1199px) { .bottom-grid-sk { grid-template-columns: 1fr; } }

    .tokens-list-sk { display: flex; flex-direction: column; gap: 16px; }
    .token-card-sk {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .token-card-header-sk {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .token-props-sk { display: flex; gap: 8px; flex-wrap: wrap; }

    .news-list-sk { display: flex; flex-direction: column; gap: 16px; }
    .news-card-sk {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ─── MARKETS ─── */
    .markets-section { margin-bottom: 60px; }
    .cex-strip-sk {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      margin-top: 24px;
    }
    .dex-grid-sk {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* ─── FOOTER ─── */
    .site-footer {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 40px 0 24px;
      margin-top: 80px;
    }
    .footer-inner-sk {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .footer-socials-sk { display: flex; gap: 12px; margin-bottom: 8px; }
    .footer-copy-sk { margin-top: 32px; display: flex; justify-content: center; }

    /* ─── Section label skeleton ─── */
    .section-label-sk { margin-bottom: 24px; }

  </style>
</head>
<body>

  <!-- ====== HEADER ====== -->

  <!-- ====== Demo toggle — 预览用，生产删除 ====== -->
  <button class="demo-bar" id="demoBtn" onclick="toggleDemo()">
    点击查看真实页面对比 →
  </button>

  <script>
    let showing = false;
    function toggleDemo() {
      showing = !showing;
      // Load real page in iframe overlay for quick comparison
      const btn = document.getElementById('demoBtn');
      let overlay = document.getElementById('demoOverlay');

      if (showing) {
        if (!overlay) {
          overlay = document.createElement('iframe');
          overlay.id = 'demoOverlay';
          overlay.src = 'index.html';
          Object.assign(overlay.style, {
            position: 'fixed', inset: '0', width: '100%', height: '100%',
            border: 'none', zIndex: '500',
            animation: 'fadeIn 0.25s ease'
          });
          const style = document.createElement('style');
          style.textContent = '@keyframes fadeIn{from{opacity:0}to{opacity:1}}';
          document.head.appendChild(style);
          document.body.appendChild(overlay);
        } else {
          overlay.style.display = 'block';
        }
        btn.textContent = '← 返回骨架屏';
        btn.style.zIndex = '999';
      } else {
        if (overlay) overlay.style.display = 'none';
        btn.textContent = '点击查看真实页面对比 →';
      }
    }
  </script>
