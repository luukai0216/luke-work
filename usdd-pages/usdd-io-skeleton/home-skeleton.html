<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USDD — Skeleton · home.usdd.io</title>
  <style>

    /* ─── Reset ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c0c0e;
      color: #fff;
      overflow-x: hidden;
    }

    /* ─── Container ─── */
    .w {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ─── Shimmer ─── */
    @keyframes shimmer {
      0%   { background-position: -900px 0; }
      100% { background-position:  900px 0; }
    }

    /* Base skeleton atom */
    .sk {
      display: block;
      background: rgba(255,255,255,0.06);
      background-image: linear-gradient(
        90deg,
        rgba(255,255,255,0.00)  0%,
        rgba(255,255,255,0.05) 35%,
        rgba(255,255,255,0.10) 50%,
        rgba(255,255,255,0.05) 65%,
        rgba(255,255,255,0.00) 100%
      );
      background-size: 900px 100%;
      background-repeat: no-repeat;
      animation: shimmer 1.8s infinite linear;
      border-radius: 8px;
    }

    /* Green-tinted card shell — mirrors real page border */
    .sk-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(33, 108, 88, 0.18);
      border-radius: 24px;
    }

    /* Chart bars container */
    .chart-wrap {
      width: 100%;
      background: rgba(255,255,255,0.02);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      padding: 16px 12px 8px;
    }
    .chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 100%;
    }
    .cb {
      flex: 1;
      border-radius: 2px 2px 0 0;
      background: rgba(255,255,255,0.07);
      background-image: linear-gradient(90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.06) 50%,
        rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: shimmer 2.2s infinite linear;
    }

    /* ══════════════════════════════
       HEADER
    ══════════════════════════════ */
    .sk-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 80px;
      background: rgba(12,12,14,0.92);
      border-bottom: 1px solid rgba(33,108,88,0.12);
      backdrop-filter: blur(12px);
    }
    .sk-header .w {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }
    .hd-logo {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .hd-nav {
      display: flex;
      gap: 4px;
      flex: 1;
    }
    .hd-nav-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
    }

    /* ══════════════════════════════
       BANNER
    ══════════════════════════════ */
    .sk-banner {
      position: relative;
      overflow: hidden;
      min-height: 838px;
      /* Green radial glow matching real page */
      background:
        radial-gradient(ellipse 60% 70% at 75% 30%, rgba(33,108,88,0.13) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 20% 80%, rgba(33,108,88,0.06) 0%, transparent 60%),
        #0c0c0e;
    }
    .banner-inner {
      padding-top: 130px;
      padding-bottom: 60px;
    }
    .banner-title-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      max-width: 660px;
    }
    .banner-btns {
      display: flex;
      gap: 16px;
      margin-bottom: 64px;
    }
    .banner-data {
      display: flex;
      gap: 24px;
    }
    .banner-data-item {
      flex: 1;
      height: 177px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* ══════════════════════════════
       BANNER CAROUSEL
    ══════════════════════════════ */
    .sk-carousel {
      height: 133px;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 24px;
      overflow: hidden;
      background: rgba(255,255,255,0.015);
      border-top: 1px solid rgba(33,108,88,0.08);
      border-bottom: 1px solid rgba(33,108,88,0.08);
    }

    /* ══════════════════════════════
       EARN
    ══════════════════════════════ */
    .sk-earn {
      padding: 80px 0 80px;
    }
    .section-hd {
      text-align: center;
      margin-bottom: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .earn-grid {
      display: flex;
      gap: 24px;
    }
    .earn-card {
      flex: 1;
      min-height: 763px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      position: relative;
      overflow: hidden;
    }
    /* Green glow inside left earn card */
    .earn-card:first-child::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 10%, rgba(33,108,88,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    .earn-card-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .chain-tabs {
      display: flex;
      gap: 6px;
    }
    .apy-nums {
      display: flex;
      gap: 40px;
    }
    .apy-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chart-box {
      flex: 1;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chart-axis {
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
    }
    .calc-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .calc-row {
      display: flex;
      gap: 16px;
    }
    .calc-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .calc-actions {
      display: flex;
      gap: 12px;
    }
    .calc-result {
      display: flex;
      gap: 16px;
      padding: 20px;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
    }
    .calc-result-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ══════════════════════════════
       WHY USE USDD
    ══════════════════════════════ */
    .sk-usecase {
      padding: 120px 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(33,108,88,0.07) 0%, transparent 60%),
        #0c0c0e;
    }
    .uc-main {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
    }
    .uc-main-card {
      flex: 1;
      height: 377px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }
    .uc-visual {
      flex: 1;
      border-radius: 12px;
    }
    .uc-sub {
      display: flex;
      gap: 24px;
    }
    .uc-sub-card {
      flex: 1;
      height: 318px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ══════════════════════════════
       TRANSITION
    ══════════════════════════════ */
    .sk-transition {
      padding: 80px 0 142px;
      background:
        radial-gradient(ellipse 100% 60% at 50% 50%, rgba(33,108,88,0.10) 0%, transparent 70%),
        #0c0c0e;
    }
    .tc-grid {
      display: flex;
      gap: 24px;
      margin-top: 48px;
    }
    .tc-card {
      flex: 1;
      min-height: 550px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .tc-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      flex-shrink: 0;
    }
    .tc-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    /* ══════════════════════════════
       TOKENS
    ══════════════════════════════ */
    .sk-tokens {
      padding: 80px 0;
    }
    .token-row {
      width: 100%;
      padding: 48px;
      display: flex;
      gap: 48px;
      align-items: center;
      border-radius: 24px;
      background: rgba(255,255,255,0.02);
      margin-bottom: 24px;
      min-height: 351px;
      position: relative;
      overflow: hidden;
    }
    .token-left {
      width: 588px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .token-name-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .token-chain-icons {
      display: flex;
      gap: 8px;
    }
    .token-desc {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .token-right {
      flex: 1;
      display: flex;
      gap: 24px;
    }
    .token-feat-card {
      flex: 1;
      border-radius: 20px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 200px;
    }

    /* ══════════════════════════════
       NEWS
    ══════════════════════════════ */
    .sk-news {
      padding: 0 0 80px;
    }
    .news-grid {
      display: flex;
      gap: 24px;
    }
    .news-item {
      flex: 1;
      height: 240px;
      padding: 32px;
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .news-thumb {
      width: 176px;
      height: 176px;
      border-radius: 16px;
      flex-shrink: 0;
    }
    .news-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .news-text-lines {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ══════════════════════════════
       MARKETS
    ══════════════════════════════ */
    .sk-markets {
      padding-bottom: 80px;
      overflow: hidden;
    }
    /* Full-bleed sprite strip */
    .market-sprite {
      height: 154px;
      display: flex;
      align-items: center;
      gap: 40px;
      padding: 0 40px;
      overflow: hidden;
      margin-bottom: 48px;
      background: rgba(255,255,255,0.015);
    }
    .market-partner-row {
      height: 90px;
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .market-tag {
      flex-shrink: 0;
      height: 52px;
      border-radius: 12px;
    }

    /* ══════════════════════════════
       FOOTER
    ══════════════════════════════ */
    .sk-footer {
      border-top: 1px solid rgba(33,108,88,0.12);
      padding: 72px 120px 0;
    }
    .footer-body {
      display: flex;
      gap: 0;
      margin-bottom: 48px;
      align-items: flex-start;
    }
    .footer-brand {
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }
    .footer-socials {
      display: flex;
      gap: 16px;
    }
    .footer-copy {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* Responsive */
    @media (max-width: 1199px) {
      .earn-grid, .uc-main, .tc-grid { flex-direction: column; }
      .earn-card { min-height: 500px; }
      .uc-main-card { height: auto; min-height: 320px; }
      .uc-sub { flex-wrap: wrap; }
      .uc-sub-card { min-width: calc(50% - 12px); flex: none; }
      .token-row { flex-direction: column; align-items: flex-start; }
      .token-left { width: 100%; }
      .sk-footer { padding: 48px 24px 0; }
    }
    @media (max-width: 767px) {
      .hd-nav { display: none; }
      .banner-data { flex-direction: column; }
      .news-grid { flex-direction: column; }
      .news-item { height: auto; flex-direction: column; }
      .news-thumb { width: 100%; height: 160px; }
      .uc-sub-card { min-width: 100%; height: auto; min-height: 240px; }
      .footer-body { flex-direction: column; gap: 32px; }
    }

  </style>
</head>
<body>


<!-- ══════════ HEADER ══════════ -->
<header class="sk-header">
  <div class="w">

    <!-- Logo -->
    <div class="hd-logo">
      <div class="sk" style="width:48px;height:48px;border-radius:50%;"></div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <div class="sk" style="width:52px;height:17px;"></div>
        <div class="sk" style="width:116px;height:13px;animation-delay:.08s;"></div>
      </div>
    </div>

    <!-- Nav links -->
    <nav class="hd-nav">
      <div class="hd-nav-item">
        <div class="sk" style="width:55px;height:17px;border-radius:4px;"></div>
      </div>
      <div class="hd-nav-item">
        <div class="sk" style="width:80px;height:17px;border-radius:4px;animation-delay:.05s;"></div>
        <div class="sk" style="width:10px;height:10px;border-radius:2px;animation-delay:.05s;"></div>
      </div>
      <div class="hd-nav-item">
        <div class="sk" style="width:100px;height:17px;border-radius:4px;animation-delay:.1s;"></div>
        <div class="sk" style="width:10px;height:10px;border-radius:2px;animation-delay:.1s;"></div>
      </div>
      <div class="hd-nav-item">
        <div class="sk" style="width:86px;height:17px;border-radius:4px;animation-delay:.15s;"></div>
        <div class="sk" style="width:10px;height:10px;border-radius:2px;animation-delay:.15s;"></div>
      </div>
    </nav>

    <!-- CTA button -->
    <div class="sk" style="width:155px;height:40px;border-radius:8px;flex-shrink:0;
      background:rgba(22,119,255,0.22);animation-delay:.1s;"></div>

  </div>
</header>


<!-- ══════════ BANNER ══════════ -->
<div class="sk-banner">
  <div class="w">
    <div class="banner-inner">

      <!-- Hero title — 2 lines, 40px -->
      <div class="banner-title-group">
        <div class="sk" style="height:52px;width:100%;"></div>
        <div class="sk" style="height:52px;width:78%;animation-delay:.08s;"></div>
      </div>

      <!-- Subtitle -->
      <div style="margin-bottom:32px;">
        <div class="sk" style="height:20px;width:58%;animation-delay:.05s;"></div>
      </div>

      <!-- 2 CTA buttons (200×48 each) -->
      <div class="banner-btns">
        <div class="sk" style="width:200px;height:48px;border-radius:8px;
          background:rgba(255,255,255,0.07);"></div>
        <div class="sk" style="width:200px;height:48px;border-radius:8px;
          background:rgba(22,119,255,0.25);animation-delay:.08s;"></div>
      </div>

      <!-- 3 data cards (equal, 177px tall, border-radius 24px) -->
      <div class="banner-data">

        <div class="banner-data-item sk-card">
          <div>
            <div class="sk" style="height:16px;width:60%;margin-bottom:14px;"></div>
            <div class="sk" style="height:52px;width:70%;animation-delay:.06s;border-radius:6px;"></div>
          </div>
          <div class="sk" style="width:28px;height:28px;border-radius:50%;
            animation-delay:.1s;align-self:flex-end;"></div>
        </div>

        <div class="banner-data-item sk-card">
          <div>
            <div class="sk" style="height:16px;width:55%;margin-bottom:14px;animation-delay:.04s;"></div>
            <div class="sk" style="height:52px;width:65%;animation-delay:.08s;border-radius:6px;"></div>
          </div>
          <div class="sk" style="width:28px;height:28px;border-radius:50%;
            animation-delay:.12s;align-self:flex-end;"></div>
        </div>

        <div class="banner-data-item sk-card">
          <div>
            <div class="sk" style="height:16px;width:62%;margin-bottom:14px;animation-delay:.08s;"></div>
            <div class="sk" style="height:52px;width:75%;animation-delay:.12s;border-radius:6px;"></div>
          </div>
          <div class="sk" style="width:28px;height:28px;border-radius:50%;
            animation-delay:.16s;align-self:flex-end;"></div>
        </div>

      </div>
    </div>
  </div>
</div>


<!-- ══════════ BANNER CAROUSEL ══════════ -->
<div class="sk-carousel">
  <!-- Marquee-style asset / partner logos -->
  <div class="sk" style="width:340px;height:80px;border-radius:16px;flex-shrink:0;
    background:rgba(255,255,255,0.04);"></div>
  <div class="sk" style="width:64px;height:64px;border-radius:50%;flex-shrink:0;animation-delay:.04s;"></div>
  <div class="sk" style="width:64px;height:64px;border-radius:50%;flex-shrink:0;animation-delay:.08s;"></div>
  <div class="sk" style="width:64px;height:64px;border-radius:50%;flex-shrink:0;animation-delay:.12s;"></div>
  <div class="sk" style="width:64px;height:64px;border-radius:50%;flex-shrink:0;animation-delay:.16s;"></div>
  <div class="sk" style="width:64px;height:64px;border-radius:50%;flex-shrink:0;animation-delay:.20s;"></div>
  <div class="sk" style="width:64px;height:64px;border-radius:50%;flex-shrink:0;animation-delay:.24s;"></div>
  <div class="sk" style="width:64px;height:64px;border-radius:50%;flex-shrink:0;animation-delay:.28s;"></div>
  <div class="sk" style="width:64px;height:64px;border-radius:50%;flex-shrink:0;animation-delay:.32s;"></div>
  <div class="sk" style="width:64px;height:64px;border-radius:50%;flex-shrink:0;animation-delay:.36s;"></div>
</div>


<!-- ══════════ EARN ══════════ -->
<section class="sk-earn">
  <div class="w">

    <!-- Section title -->
    <div class="section-hd">
      <div class="sk" style="height:64px;width:380px;max-width:90%;border-radius:8px;"></div>
      <div class="sk" style="height:22px;width:480px;max-width:90%;animation-delay:.06s;"></div>
    </div>

    <div class="earn-grid">

      <!-- ─ APY Card ─ -->
      <div class="earn-card sk-card">

        <div class="earn-card-hd">
          <div class="sk" style="height:26px;width:130px;"></div>
          <div class="chain-tabs">
            <div class="sk" style="height:30px;width:52px;border-radius:6px;animation-delay:.04s;"></div>
            <div class="sk" style="height:30px;width:72px;border-radius:6px;animation-delay:.08s;"></div>
            <div class="sk" style="height:30px;width:82px;border-radius:6px;animation-delay:.12s;"></div>
          </div>
        </div>

        <!-- Description lines -->
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div class="sk" style="height:15px;width:100%;animation-delay:.04s;"></div>
          <div class="sk" style="height:15px;width:85%;animation-delay:.08s;"></div>
          <div class="sk" style="height:15px;width:70%;animation-delay:.12s;"></div>
        </div>

        <!-- APY numbers: 4.5% / 7.78% -->
        <div class="apy-nums">
          <div class="apy-item">
            <div class="sk" style="height:56px;width:88px;border-radius:6px;"></div>
            <div class="sk" style="height:13px;width:72px;animation-delay:.06s;"></div>
          </div>
          <div class="apy-item">
            <div class="sk" style="height:56px;width:96px;border-radius:6px;animation-delay:.06s;"></div>
            <div class="sk" style="height:13px;width:60px;animation-delay:.1s;"></div>
          </div>
        </div>

        <!-- Line chart area -->
        <div class="chart-box">
          <div class="chart-wrap" style="flex:1;">
            <div class="chart-bars">
              <div class="cb" style="height:32%;animation-delay:.00s;"></div>
              <div class="cb" style="height:48%;animation-delay:.04s;"></div>
              <div class="cb" style="height:62%;animation-delay:.08s;"></div>
              <div class="cb" style="height:44%;animation-delay:.12s;"></div>
              <div class="cb" style="height:75%;animation-delay:.16s;"></div>
              <div class="cb" style="height:54%;animation-delay:.20s;"></div>
              <div class="cb" style="height:88%;animation-delay:.24s;"></div>
              <div class="cb" style="height:65%;animation-delay:.28s;"></div>
              <div class="cb" style="height:48%;animation-delay:.32s;"></div>
              <div class="cb" style="height:72%;animation-delay:.36s;"></div>
              <div class="cb" style="height:40%;animation-delay:.40s;"></div>
              <div class="cb" style="height:58%;animation-delay:.44s;"></div>
              <div class="cb" style="height:92%;animation-delay:.48s;"></div>
              <div class="cb" style="height:68%;animation-delay:.52s;"></div>
              <div class="cb" style="height:42%;animation-delay:.56s;"></div>
              <div class="cb" style="height:55%;animation-delay:.60s;"></div>
              <div class="cb" style="height:76%;animation-delay:.64s;"></div>
              <div class="cb" style="height:50%;animation-delay:.68s;"></div>
              <div class="cb" style="height:62%;animation-delay:.72s;"></div>
              <div class="cb" style="height:38%;animation-delay:.76s;"></div>
            </div>
          </div>
          <div class="chart-axis">
            <div class="sk" style="height:11px;width:48px;animation-delay:.00s;"></div>
            <div class="sk" style="height:11px;width:48px;animation-delay:.04s;"></div>
            <div class="sk" style="height:11px;width:48px;animation-delay:.08s;"></div>
            <div class="sk" style="height:11px;width:48px;animation-delay:.12s;"></div>
            <div class="sk" style="height:11px;width:48px;animation-delay:.16s;"></div>
          </div>
        </div>

      </div>
