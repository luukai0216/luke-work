<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Footer 改版 — app.usdd.io Prototype</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font:400 14px/1.5 Inter,-apple-system,sans-serif;background:var(--bg-page);color:var(--text-primary)}
    :root{
      --bg-page:#0F0F0F;--bg-section:#161616;--bg-card:#1A1A1A;
      --text-primary:#EBEBEB;--text-secondary:#999999;--text-tertiary:#555555;--text-disabled:#3A3A3A;
      --border-default:#2A2A2A;--border-weak:#222222;
      --accent:#4ECFA8;
      --r-xs:4px;--r-md:8px;--r-lg:16px;
    }
    .container{width:1440px;max-width:100%;margin:0 auto;padding:0 48px}
    @media(max-width:1471px){.container{width:1200px}}
    @media(max-width:1199px){.container{width:auto;padding:0 24px}}

    .main{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-disabled);font-size:12px;letter-spacing:.08em}

    /* ── Footer ── */
    .app-footer{
      background:var(--bg-card);
      border-top:1px solid var(--border-default);
    }

    /* 上栏：三区 */
    .app-footer-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      padding:20px 0 20px;
    }

    /* 左：社交图标组 */
    .footer-socials{display:flex;align-items:center;gap:4px}
    .footer-social-btn{
      display:inline-flex;align-items:center;justify-content:center;
      width:34px;height:34px;
      border-radius:50%;
      border:1px solid var(--border-default);
      color:var(--text-secondary);
      font-size:16px;
      text-decoration:none;
      transition:border-color .15s,color .15s,background .15s;
    }
    .footer-social-btn:hover{border-color:#444;color:var(--text-primary);background:var(--bg-section)}

    /* 中：品牌 */
    .footer-brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
    .footer-logo{
      width:40px;height:40px;border-radius:50%;
      border:1.5px solid var(--accent);
      display:flex;align-items:center;justify-content:center;
      font-size:18px;color:var(--accent);
      flex-shrink:0;
    }
    .footer-brand-name{
      font-size:17px;font-weight:600;letter-spacing:-.01em;
      color:var(--text-primary);
      white-space:nowrap;
    }
    .footer-brand-name span{color:var(--accent)}
    .footer-brand-desc{font-size:12px;color:var(--text-secondary);max-width:300px;line-height:1.6}

    /* 右：联系 */
    .footer-contact{display:flex;align-items:center}
    .footer-contact-link{
      display:inline-flex;align-items:center;gap:6px;
      height:34px;padding:0 12px;
      font-size:13px;color:var(--text-secondary);
      text-decoration:none;
      border:1px solid var(--border-default);
      border-radius:var(--r-md);
      transition:border-color .15s,color .15s,background .15s;
      white-space:nowrap;
    }
    .footer-contact-link:hover{border-color:#444;color:var(--text-primary);background:var(--bg-section)}

    /* 分割线 */
    .app-footer-divider{height:1px;background:var(--border-default)}

    /* 下栏：导航分组 + 版权 */
    .app-footer-bottom{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      padding:16px 0;
    }

    /* 左：导航链接分组 */
    .footer-nav{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
    .footer-nav-group{display:flex;align-items:center;gap:2px}
    .footer-nav-sep{
      width:1px;height:14px;
      background:var(--border-default);
      margin:0 6px;
      flex-shrink:0;
    }
    .footer-nav-link{
      display:inline-flex;align-items:center;gap:4px;
      height:30px;padding:0 8px;
      font-size:12.5px;color:var(--text-secondary);
      text-decoration:none;
      border-radius:var(--r-md);
      white-space:nowrap;
      transition:background .15s,color .15s;
    }
    .footer-nav-link:hover{background:var(--bg-section);color:var(--text-primary)}
    .footer-nav-link.disabled{color:var(--text-disabled);cursor:not-allowed;pointer-events:none}
    .footer-nav-badge{
      font-size:10px;padding:1px 5px;
      border:1px solid var(--border-weak);
      border-radius:var(--r-xs);
      color:var(--text-disabled);
    }
    .footer-nav-ext{font-size:11px;opacity:.5;margin-left:1px}

    /* 右：版权 */
    .footer-copyright{
      font-size:12px;color:var(--text-tertiary);
      white-space:nowrap;flex-shrink:0;
    }

    /* 响应式 */
    @media(max-width:900px){
      .footer-brand-desc{display:none}
      .footer-brand-name{font-size:15px}
    }
    @media(max-width:640px){
      .app-footer-top{flex-direction:column;align-items:center;padding:24px 0 16px;gap:16px}
      .footer-brand{order:-1}
      .footer-socials,.footer-contact{width:100%;justify-content:center}
      .app-footer-bottom{flex-direction:column;align-items:flex-start;gap:12px;padding:14px 0}
    }
  </style>
</head>
<body>

<main class="main">APP CONTENT AREA</main>

<footer class="app-footer">
  <div class="container">

    <!-- 上栏 -->
    <div class="app-footer-top">

      <!-- 左：社交图标 -->
      <div class="footer-socials">
        <a href="https://x.com/usdd_io" target="_blank" class="footer-social-btn" title="X / Twitter">
          <i class="ri-twitter-x-line"></i>
        </a>
        <a href="https://t.me/usdd_official" target="_blank" class="footer-social-btn" title="Telegram">
          <i class="ri-telegram-line"></i>
        </a>
        <a href="https://discord.gg/usdd" target="_blank" class="footer-social-btn" title="Discord">
          <i class="ri-discord-line"></i>
        </a>
      </div>

      <!-- 中：品牌 -->
      <div class="footer-brand">
        <div class="footer-logo"><i class="ri-money-dollar-circle-line"></i></div>
        <div class="footer-brand-name">Decentralized <span>USD</span></div>
        <div class="footer-brand-desc">USDD is a fully Decentralized stablecoin pegged to the US Dollar through crypto reserves.</div>
      </div>

      <!-- 右：联系 -->
      <div class="footer-contact">
        <a href="mailto:contact@usdd.io" class="footer-contact-link">
          <i class="ri-mail-line" style="font-size:13px"></i>
          contact@usdd.io
        </a>
      </div>

    </div><!-- /top -->

    <div class="app-footer-divider"></div>

    <!-- 下栏 -->
    <div class="app-footer-bottom">

      <!-- 左：导航分组 -->
      <nav class="footer-nav">
        <!-- Legal -->
        <div class="footer-nav-group">
          <a href="https://docs.usdd.io/lrgals/terms-of-use" target="_blank" class="footer-nav-link">
            Terms<i class="ri-external-link-line footer-nav-ext"></i>
          </a>
          <a href="https://docs.usdd.io/lrgals/privacy-policy" target="_blank" class="footer-nav-link">
            Privacy<i class="ri-external-link-line footer-nav-ext"></i>
          </a>
        </div>
        <div class="footer-nav-sep"></div>
        <!-- Docs -->
        <div class="footer-nav-group">
          <a href="https://docs.usdd.io/" target="_blank" class="footer-nav-link">
            Docs<i class="ri-external-link-line footer-nav-ext"></i>
          </a>
          <a href="https://usdd.io/faq" target="_blank" class="footer-nav-link">
            FAQs<i class="ri-external-link-line footer-nav-ext"></i>
          </a>
        </div>
        <div class="footer-nav-sep"></div>
        <!-- Dev -->
        <div class="footer-nav-group">
          <span class="footer-nav-link disabled">
            MCP Server<span class="footer-nav-badge">Soon</span>
          </span>
        </div>
      </nav>

      <!-- 右：版权 -->
      <div class="footer-copyright">Copyright © 2026 USDD. All rights reserved</div>

    </div><!-- /bottom -->

  </div>
</footer>

</body>
</html>
