<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面未找到 — TronLink</title>
<link rel="stylesheet" href="shared.css">
<style>
body { min-height: 100vh; display: flex; flex-direction: column; }

.error-wrap {
  flex: 1; padding: var(--space-9) var(--container-pad);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  background: radial-gradient(ellipse at 50% 30%, rgba(43, 106, 255, 0.18), transparent 60%);
}
.error-icon {
  width: 160px; height: 160px;
  background: var(--color-primary);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 80px; color: #FFF;
  box-shadow: 0 24px 64px var(--color-primary-glow);
  margin-bottom: var(--space-6);
  animation: float-ip 4s ease-in-out infinite;
}
@keyframes float-ip { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

.error-code {
  font-family: var(--font-mono);
  font-size: var(--text-xs); color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 2px;
  margin-bottom: var(--space-3);
}
.error-title {
  font-size: var(--text-5xl); font-weight: 700;
  margin-bottom: var(--space-4); line-height: var(--leading-tight);
}
.error-title .accent { color: var(--color-primary); }
.error-desc {
  font-size: var(--text-xl); color: var(--text-secondary);
  max-width: 520px; margin: 0 auto var(--space-7);
  line-height: var(--leading-normal);
}
.error-actions {
  display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap;
  margin-bottom: var(--space-8);
}

.recommend {
  max-width: 720px; margin: 0 auto;
  padding: var(--space-6); background: var(--bg-secondary);
  border: 1px solid var(--border-default); border-radius: var(--radius-xl);
}
.recommend h3 {
  font-size: var(--text-sm); color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: var(--space-4);
}
.recommend-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
.recommend-list a {
  padding: var(--space-3) var(--space-4); background: var(--bg-elevated);
  border: 1px solid var(--border-default); border-radius: var(--radius-md);
  color: var(--text-primary); text-decoration: none;
  display: flex; gap: var(--space-3); align-items: center;
  transition: all 0.15s;
}
.recommend-list a:hover { border-color: var(--color-primary); transform: translateY(-1px); }
.recommend-list .icon { font-size: 20px; flex-shrink: 0; }
.recommend-list .text { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.recommend-list .name { font-weight: 600; font-size: var(--text-sm); }
.recommend-list .desc { font-size: var(--text-xs); color: var(--text-secondary); }

@media (max-width: 640px) {
  .error-icon { width: 120px; height: 120px; font-size: 56px; }
  .error-title { font-size: var(--text-4xl); }
  .recommend-list { grid-template-columns: 1fr; }
}
</style>
</head>
<body data-theme="light" data-lang="zh-CN">
<script src="shared.js"></script>
<script>injectControlBar('404');</script>

<div id="site-nav"></div>

<main class="error-wrap">
  <div class="error-icon">🔷</div>
  <div class="error-code">Error 404 · Page Not Found</div>
  <h1 class="error-title">这个页面 <span class="accent">不见了</span></h1>
  <p class="error-desc">你访问的页面可能已被移动、删除，或是输入有误。回到首页或按推荐查看其他内容。</p>

  <div class="error-actions">
    <a href="home.html" class="btn btn-primary btn-large">返回首页</a>
    <a href="https://support.tronlink.org" target="_blank" rel="noopener" class="btn btn-secondary btn-large">寻求帮助 ↗</a>
  </div>

  <div class="recommend">
    <h3>你可能感兴趣</h3>
    <div class="recommend-list">
      <a href="download.html"><span class="icon">📥</span><div class="text"><span class="name">下载 TronLink</span><span class="desc">iOS / Android / 浏览器插件</span></div></a>
      <a href="features.html"><span class="icon">✨</span><div class="text"><span class="name">所有功能</span><span class="desc">Swap / Staking / 多签</span></div></a>
      <a href="security.html"><span class="icon">🛡️</span><div class="text"><span class="name">安全中心</span><span class="desc">官方域名与反钓鱼</span></div></a>
      <a href="https://support.tronlink.org" target="_blank" rel="noopener"><span class="icon">💬</span><div class="text"><span class="name">帮助中心 ↗</span><span class="desc">常见问题与工单</span></div></a>
      <a href="home.html#ecosystem"><span class="icon">🌐</span><div class="text"><span class="name">TRON 生态</span><span class="desc">DApp 与合作伙伴</span></div></a>
      <a href="developers.html"><span class="icon">💻</span><div class="text"><span class="name">开发者中心</span><span class="desc">SDK / API / 集成指南</span></div></a>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script>
document.getElementById('site-nav').innerHTML = injectSiteNav();
document.getElementById('site-footer').innerHTML = injectSiteFooter();
setLang(document.body.getAttribute('data-lang') || 'zh-CN');
</script>
</body>
</html>
