                - generic [ref=e403]: Announcement on USDD Base APY Adjustment & Dynamic Pricing Mechanism
                - generic [ref=e404]: "Dear USDD community,As the USDD ecosystem and our multi-chain operations continue to grow, we remain committed to refining our yield model. To maximize on-chain capital efficiency and ensure the long-term resilience of the ecosystem, we will adjust USDD’s Base APY across BNB Chain, Ethereum, and TRON.Dynamic APY Pricing MechanismTo maintain long-term stability and sustainability, USDD utilizes a “Dynamic APY Pricing Model” to guide interest rate evaluations and adjustments. The Base APY is determined based on the following core factors:● Crypto Market Performance: We continuously monitor the 7-day moving average yield of leading yield-bearing stablecoins in the crypto market to establish an industry baseline.● Federal Reserve Rate: We factor in traditional risk-free rates – specifically the U.S. Federal Funds rate – to ensure the Base APY remains above TradFi benchmarks, safeguarding baseline returns for our users.● Competitive Premium: Rather than just matching the DeFi and TradFi baselines above, we also maintain a strategic premium to ensure our rates remain highly competitive.● Protocol Revenue & Sustainability: We align the APY with the actual yield generated by the protocol’s underlying assets, keeping rates within a healthy range to optimize capital efficiency and ensure long-term viability.Under this dynamic pricing model, the Base APY will be uniformly adjusted to 4.75%. This update is designed to better balance capital efficiency with user returns, so that users can earn transparent, reliable yields that consistently outperform TradFi risk-free rates.For the exact implementation dates, please refer to the follow-up announcements from official USDD channels and our ecosystem partners.We will continue to evaluate this adjustment to ensure our yield strategy remains both competitive and sustainable.Thank you for your continued support!The USDD Team"
